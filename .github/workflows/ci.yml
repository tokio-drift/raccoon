name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Go checks (gofmt, vet, tests)
        run: make check

      - name: Build UI
        run: make ui

      - name: Fail if web/dist is stale
        run: scripts/check_dist.sh
